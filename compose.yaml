services:
  codester:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - codester-data:/data
      - type: bind
        source: ${CODEX_HOST_HOME:-${HOME}/.codex}
        target: /host-codex
        read_only: true
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-${HOME}/.docker/run/docker.sock}
        target: /var/run/docker.sock
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock
    group_add:
      - ${DOCKER_SOCKET_GID:-0}
    environment:
      CODESTER_CODEX_ACTIVITY_HOME: /host-codex
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  codester-data:
