<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Codester{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='codester-mark-concept.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<a class="skip" href="#main">Skip to content</a>
{% block header %}
<header class="topbar">
  <a class="wordmark" href="/" aria-label="Codester overview"><img class="brand-mark" src="{{ url_for('static', filename='codester-mark-concept.png') }}" alt=""> codester<span class="wordmark-dot">.</span></a>
  <div class="topbar-context">YOUR WORK, IN VIEW</div>
  <nav aria-label="Main navigation">
    {% block navigation %}{% endblock %}
  </nav>
</header>
{% endblock %}
{% block content %}{% endblock %}
</body>
</html>
