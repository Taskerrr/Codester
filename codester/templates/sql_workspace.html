<section id="sql-workspace" class="workspace-view sql-workspace" aria-label="PostgreSQL workspace" hidden>
  <header class="workspace-heading">
    <h1><img src="/static/postgresql.svg" alt=""> PostgreSQL</h1>
    <nav class="pg-tabs" aria-label="PostgreSQL workspace"><button id="sql-tab-editor" type="button" aria-pressed="true">Query</button><button id="sql-tab-activity" type="button" aria-pressed="false">Activity &amp; locks</button></nav>
    <div class="sql-connection-bar"><select id="sql-connection" aria-label="Connection"></select></div>
  </header>
  <p id="sql-notice" role="status" class="help"></p>
  <form id="sql-connection-form" class="sql-connection-form" hidden>
    <h2 id="sql-connection-title">New connection</h2>
    <div class="sql-connection-fields">
      <label>Name<input name="name" required maxlength="80" placeholder="Development"></label>
      <label>Environment<select name="environment"><option value="development">Development</option><option value="production">Production</option></select></label>
      <label>Host<input name="host" required value="127.0.0.1"></label>
      <label>Port<input name="port" required type="number" min="1" max="65535" value="5432"></label>
      <label>Database<input name="database" required></label>
      <label>Username<input name="username" required autocomplete="off"></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" maxlength="4096"><small>Leave blank to keep a saved password.</small></label>
      <label>TLS<select name="sslmode"><option value="require">Require</option><option value="verify-full">Verify full</option><option value="verify-ca">Verify CA</option><option value="prefer">Prefer</option><option value="disable">Disable</option></select></label>
      <label>CA certificate path<input name="sslrootcert" placeholder="Optional local file path"></label>
      <label class="sql-clear-password"><input name="clear_password" type="checkbox"> Remove saved password</label>
    </div>
    <p class="help">For SSH, use 127.0.0.1 and the tunnel's local port. Connect the tunnel using the dots beneath the clock.</p>
    <div class="sql-actions"><button type="submit" class="primary-button">Save connection</button><button id="sql-close-connection" type="button" class="quiet-button">Cancel</button><button id="sql-delete-connection" type="button" class="quiet-button">Delete connection</button></div>
    <p id="sql-connection-error" role="alert"></p>
  </form>
  <div id="sql-editor-view" class="sql-editor-view">
    <section class="sql-editor-pane" aria-label="Query editor">
      <textarea id="sql-query" rows="1" spellcheck="false" autocomplete="off" aria-label="SQL query" placeholder="SELECT …"></textarea>
      <div class="sql-run-controls"><button id="sql-run" type="button" class="sql-run" aria-label="Run query" title="Run query (Ctrl/⌘ Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l14 8-14 8z"/></svg></button><span id="sql-elapsed" aria-label="Query duration"></span></div>
    </section>
    <section class="sql-results-pane" aria-label="Query results"><div id="sql-result-status" role="status"></div><div id="sql-results" class="sql-results" tabindex="0"></div></section>
  </div>
  <section id="sql-activity-view" class="postgres-main" hidden>
    {% with embedded_activity=true %}
    {% include 'postgres_activity.html' %}
    {% endwith %}
  </section>
</section>
