{% extends 'base.html' %}
{% block title %}Docker · Codester{% endblock %}
{% block bodyclass %}docker-page{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="{{ url_for('static', filename='docker.css') }}">
<script type="module" src="{{ url_for('static', filename='docker.js') }}"></script>
{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<main id="main" class="docker-view">
  <header class="docker-header">
    <a class="docker-back" href="/" aria-label="Back to dashboard">‹</a>
    <img src="{{ url_for('static', filename='docker.svg') }}" alt="">
    <div><h1>Docker</h1><span>LOCAL CONTAINERS</span></div>
    <p id="docker-status" role="status"></p>
    <button id="docker-refresh" class="docker-refresh" type="button" aria-label="Refresh containers" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8.2A7 7 0 0 1 18.7 7M17.9 15.8A7 7 0 0 1 5.3 17"/></svg></button>
  </header>
  <section id="docker-summary" class="docker-summary" aria-label="Container summary">
    <div><strong>—</strong><span>RUNNING</span></div><div><strong>—</strong><span>STOPPED</span></div><div><strong>—</strong><span>TOTAL</span></div>
  </section>
  <section class="docker-containers" aria-labelledby="containers-title">
    <div class="docker-section-title"><h2 id="containers-title">Containers</h2><span id="docker-updated"></span></div>
    <div id="container-list" class="container-list"><span class="docker-loader" role="status" aria-label="Loading containers"></span></div>
  </section>
</main>
{% endblock %}
