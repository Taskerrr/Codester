[project]
name = "codester"
version = "0.1.0"
description = "A local touchscreen dashboard for Codex, Dagster and SigNoz"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "waitress>=3,<4", "httpx>=0.28,<1", "cryptography>=44,<47", "keyring>=25.6,<26"]

[project.scripts]
codester-askpass = "codester.ssh_askpass:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "ty>=0.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
